[package]
name = "blindside"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "blindside"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
# 0.18.x matches MagicBlock's public TEE (Private Ephemeral Rollup) endpoints.
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor-compat", "access-control"] }
# SHA-256 via the on-chain syscall (sha2 when testing on the host).
solana-sha256-hasher = "2.3.0"
# Zero-copy round slots; arrays longer than 32 need min_const_generics.
bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
